<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentinel-test</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0b0f14; color:#d7dde4; }
  .panel { background:#121820; border:1px solid #1f2a36; border-radius:0.5rem; }
  input, textarea, select { background:#0b0f14; border:1px solid #2a3847; border-radius:0.375rem;
    padding:0.3rem 0.5rem; font-size:0.8rem; color:#d7dde4; width:100%; }
  button { border-radius:0.375rem; padding:0.3rem 0.7rem; font-size:0.8rem; font-weight:600; }
  .btn-primary { background:#2563eb; color:white; } .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#1f2a36; color:#9fb0c0; } .btn-ghost:hover { background:#2a3847; }
  .chip { font-size:0.7rem; padding:0.15rem 0.6rem; border-radius:999px; background:#1f2a36;
    color:#9fb0c0; cursor:pointer; }
  .chip.active { background:#2563eb; color:white; }
</style>
</head>
<body class="h-screen overflow-hidden text-sm">

<div id="banner" class="hidden px-4 py-2 bg-red-900/80 text-red-100 text-xs font-semibold"></div>

<div class="grid grid-cols-[280px_1fr_300px] gap-3 p-3 h-full">

  <!-- LEFT: sources + brief -->
  <div class="flex flex-col gap-3 overflow-y-auto pr-1">
    <div class="panel p-3">
      <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Twitch (live, read-only)</h2>
      <div class="flex gap-2">
        <input id="twitch-channel" placeholder="channel name">
        <button id="twitch-btn" class="btn-primary shrink-0">Join</button>
      </div>
      <div id="twitch-status" class="text-xs text-slate-500 mt-2">disconnected</div>
    </div>

    <div class="panel p-3" id="instagram-panel">
      <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Instagram (replay, read-only)</h2>
      <textarea id="ig-paste" rows="4" class="mb-2"
        placeholder="one comment per line&#10;author: text  (or just text)"></textarea>
      <div class="flex gap-2 items-center mb-2">
        <input type="file" id="ig-file" accept=".json,.csv,.txt" class="text-[10px] p-0 border-0">
      </div>
      <div class="flex gap-2 items-center">
        <label class="text-[10px] text-slate-500 shrink-0">rate/s</label>
        <input type="number" id="ig-rate" value="2" min="0.1" max="20" step="0.5" style="width:4rem">
        <button id="ig-replay" class="btn-primary flex-1">Replay</button>
        <button id="ig-stop" class="btn-ghost">Stop</button>
      </div>
      <button id="ig-fetch" class="btn-ghost w-full mt-2 hidden">Fetch via Graph API</button>
      <div id="ig-status" class="text-[10px] text-slate-500 mt-2"></div>
    </div>

    <div class="panel p-3" id="brief-panel">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400">Brief</h2>
        <span id="brief-version" class="text-[10px] text-slate-500 font-mono">v1</span>
      </div>
      <select id="brief-preset" class="mb-2"></select>
      <textarea id="brief-context" rows="4" class="mb-2" placeholder="creator context"></textarea>
      <div id="topics" class="flex flex-col gap-2 mb-2"></div>
      <div class="flex gap-2">
        <button id="add-topic" class="btn-ghost flex-1">+ topic</button>
        <button id="apply-brief" class="btn-primary flex-1">Apply brief</button>
      </div>
    </div>
  </div>

  <!-- CENTRE: live feed -->
  <div class="flex flex-col panel overflow-hidden">
    <div class="flex items-center gap-2 px-3 py-2 border-b border-[#1f2a36]">
      <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mr-2">Feed</h2>
      <span class="chip active" data-filter="all">all</span>
      <span class="chip" data-filter="hostile">hostile only</span>
      <span class="chip" data-filter="grey">grey zone &lt;0.6</span>
      <span class="flex-1"></span>
      <label class="flex items-center gap-1 text-xs text-slate-400">
        <input type="checkbox" id="split-toggle" class="w-auto">split vs
        <select id="split-preset" class="w-auto text-xs py-0.5"></select>
      </label>
    </div>
    <div id="feed" class="flex-1 overflow-y-auto divide-y divide-[#17202b]"></div>
  </div>

  <!-- RIGHT: stats + tools -->
  <div class="flex flex-col gap-3 overflow-y-auto pr-1">
    <div class="panel p-3">
      <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Stats</h2>
      <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs" id="stats-grid"></div>
      <div class="mt-3">
        <div class="text-xs text-slate-500 mb-1">class distribution</div>
        <div id="class-dist" class="flex h-3 rounded overflow-hidden bg-[#1f2a36]"></div>
        <div id="class-legend" class="mt-1 flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] text-slate-400"></div>
      </div>
    </div>
    <div class="panel p-3 text-xs text-slate-500" id="tools-panel">
      <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Tools</h2>
      coming in step 5
    </div>
  </div>
</div>

<script>
// ---------- class colours ----------
const FIXED_COLORS = { ok:'#10b981', noise:'#64748b', critique:'#f59e0b', hostile_other:'#ef4444' };
const HOSTILE_PALETTE = ['#e11d48', '#c026d3', '#9333ea', '#ea580c', '#db2777'];
const colorCache = {};
function classColor(klass) {
  if (FIXED_COLORS[klass]) return FIXED_COLORS[klass];
  if (!(klass in colorCache)) {
    colorCache[klass] = HOSTILE_PALETTE[Object.keys(colorCache).length % HOSTILE_PALETTE.length];
  }
  return colorCache[klass];
}

// ---------- state ----------
let filter = 'all';
const MAX_ROWS = 200;
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- feed rendering ----------
function probBar(probs) {
  const segs = Object.entries(probs).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div title="${esc(k)}: ${(v*100).toFixed(0)}%" style="width:${v*100}%;background:${classColor(k)}"></div>`);
  return `<div class="flex h-1.5 rounded overflow-hidden bg-[#1f2a36] mt-1">${segs.join('')}</div>`;
}

function verdictBlock(v) {
  return `<div class="flex items-center gap-2">
    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold text-white"
          style="background:${classColor(v.klass)}">${esc(v.klass)}</span>
    <span class="text-[10px] text-slate-400">conf ${(v.confidence).toFixed(2)}</span>
    <span class="text-[10px] text-slate-500">${v.latency_ms}ms · $${v.cost_usd.toFixed(6)} · v${v.brief_version}</span>
  </div>${probBar(v.probabilities)}`;
}

function rowMatchesFilter(row) {
  if (filter === 'hostile') return row.verdict.klass.startsWith('hostile');
  if (filter === 'grey') return row.verdict.confidence < 0.6;
  return true;
}

function addRow(row) {
  const feed = document.getElementById('feed');
  const el = document.createElement('div');
  el.className = 'px-3 py-2 feed-row';
  el.dataset.row = JSON.stringify(row);
  const time = new Date(row.ts * 1000).toLocaleTimeString();
  const badges = (row.author.badges || []).map(b => b.split('/')[0]).slice(0,3).join(',');
  const splitBlock = row.split
    ? `<div class="mt-1 pl-2 border-l-2 border-[#2a3847]">
         <div class="text-[10px] text-slate-500 mb-0.5">split · ${esc(row.split_key || '')}</div>
         ${verdictBlock(row.split)}</div>`
    : '';
  el.innerHTML = `
    <div class="flex items-baseline gap-2">
      <span class="text-[10px] text-slate-500 shrink-0">${time}</span>
      <span class="font-semibold text-xs text-slate-300 shrink-0">${esc(row.author.name)}</span>
      ${badges ? `<span class="text-[9px] text-slate-500">[${esc(badges)}]</span>` : ''}
      ${row.author.is_new_to_stream ? '<span class="text-[9px] text-sky-400">new</span>' : ''}
      <span class="text-[10px] text-slate-600 ml-auto shrink-0">${esc(row.source)}</span>
    </div>
    <div class="text-xs text-slate-200 my-1 break-words">${esc(row.text)}</div>
    ${verdictBlock(row.verdict)}
    ${splitBlock}
    <div class="row-actions mt-1"></div>`;
  el.style.display = rowMatchesFilter(row) ? '' : 'none';
  feed.prepend(el);
  while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
  window.decorateRow && window.decorateRow(el);   // label control hook (step 5)
}

document.querySelectorAll('.chip[data-filter]').forEach(chip => chip.onclick = () => {
  document.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  filter = chip.dataset.filter;
  document.querySelectorAll('.feed-row').forEach(el => {
    el.style.display = rowMatchesFilter(JSON.parse(el.dataset.row)) ? '' : 'none';
  });
});

// ---------- stats ----------
function renderStats(s) {
  const pairs = [
    ['msgs/min', s.msgs_per_min], ['classified', s.classified],
    ['dropped', s.dropped], ['queue', s.queue_size],
    ['p50 latency', s.latency_p50 + 'ms'], ['p95 latency', s.latency_p95 + 'ms'],
    ['cost', '$' + s.cost_usd.toFixed(4) + ' / $' + s.max_cost_usd.toFixed(2)],
    ['brief', 'v' + s.brief_version],
  ];
  document.getElementById('stats-grid').innerHTML = pairs.map(([k, v]) =>
    `<div class="text-slate-500">${k}</div><div class="text-right font-mono">${v}</div>`).join('');

  const total = Object.values(s.class_counts).reduce((a,b)=>a+b, 0) || 1;
  document.getElementById('class-dist').innerHTML =
    Object.entries(s.class_counts).sort((a,b)=>b[1]-a[1]).map(([k, n]) =>
      `<div title="${esc(k)}: ${n}" style="width:${n/total*100}%;background:${classColor(k)}"></div>`).join('');
  document.getElementById('class-legend').innerHTML =
    Object.entries(s.class_counts).sort((a,b)=>b[1]-a[1]).map(([k, n]) =>
      `<span><span style="color:${classColor(k)}">●</span> ${esc(k)} ${n}</span>`).join('');
  if (s.paused) showBanner(`Budget exceeded ($${s.cost_usd.toFixed(2)} / $${s.max_cost_usd.toFixed(2)}) — classification paused.`);
}

function showBanner(text) {
  const b = document.getElementById('banner');
  b.textContent = text;
  b.classList.remove('hidden');
}

// ---------- twitch controls ----------
const twitchBtn = document.getElementById('twitch-btn');
let twitchConnected = false;
twitchBtn.onclick = async () => {
  if (twitchConnected) {
    await fetch('/twitch/part', {method:'POST'});
  } else {
    const channel = document.getElementById('twitch-channel').value.trim();
    if (!channel) return;
    await fetch('/twitch/join', {method:'POST', headers:{'Content-Type':'application/json'},
                                 body: JSON.stringify({channel})});
  }
};
function renderTwitch(status, channel) {
  twitchConnected = status === 'connected' || status === 'connecting' || status === 'reconnecting';
  twitchBtn.textContent = twitchConnected ? 'Leave' : 'Join';
  twitchBtn.className = (twitchConnected ? 'btn-ghost' : 'btn-primary') + ' shrink-0';
  document.getElementById('twitch-status').textContent =
    channel ? `${status} — #${channel}` : status;
}

// ---------- brief editor ----------
let presets = {};

function topicRow(t = {key:'', label:'', description:'', policy:'remove'}) {
  const row = document.createElement('div');
  row.className = 'topic-row border border-[#1f2a36] rounded p-2 flex flex-col gap-1';
  row.innerHTML = `
    <div class="flex gap-1">
      <input class="t-key" placeholder="key" value="${esc(t.key)}" style="width:35%">
      <input class="t-label" placeholder="label" value="${esc(t.label)}">
      <button class="t-del btn-ghost shrink-0 px-2">×</button>
    </div>
    <textarea class="t-desc" rows="2" placeholder="description">${esc(t.description)}</textarea>
    <select class="t-policy">
      ${['remove','hold','tolerate'].map(p =>
        `<option ${p===t.policy?'selected':''}>${p}</option>`).join('')}
    </select>`;
  row.querySelector('.t-del').onclick = () => row.remove();
  return row;
}

function loadBriefForm(brief) {
  document.getElementById('brief-context').value = brief.creator_context;
  const topics = document.getElementById('topics');
  topics.innerHTML = '';
  brief.topics.forEach(t => topics.appendChild(topicRow(t)));
}

document.getElementById('add-topic').onclick = () =>
  document.getElementById('topics').appendChild(topicRow());

document.getElementById('brief-preset').onchange = e => {
  if (presets[e.target.value]) loadBriefForm(presets[e.target.value]);
};

document.getElementById('apply-brief').onclick = async () => {
  const topics = [...document.querySelectorAll('.topic-row')].map(row => ({
    key: row.querySelector('.t-key').value.trim(),
    label: row.querySelector('.t-label').value.trim(),
    description: row.querySelector('.t-desc').value.trim(),
    policy: row.querySelector('.t-policy').value,
  })).filter(t => t.key && t.description);
  const body = {
    name: document.getElementById('brief-preset').value || 'custom',
    creator_context: document.getElementById('brief-context').value,
    topics,
  };
  const res = await fetch('/brief/apply', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const out = await res.json();
  if (!res.ok || !out.ok) alert('apply failed: ' + JSON.stringify(out));
};

window.onBriefEvent = msg => {
  document.getElementById('brief-version').textContent = 'v' + msg.version;
};

// ---------- split mode ----------
async function pushSplit() {
  const on = document.getElementById('split-toggle').checked;
  const key = document.getElementById('split-preset').value;
  await fetch('/split', {method:'POST', headers:{'Content-Type':'application/json'},
                         body: JSON.stringify({preset_key: on ? key : null})});
}
document.getElementById('split-toggle').onchange = pushSplit;
document.getElementById('split-preset').onchange = () => {
  if (document.getElementById('split-toggle').checked) pushSplit();
};

// ---------- instagram ----------
const igStatus = text => document.getElementById('ig-status').textContent = text;

document.getElementById('ig-replay').onclick = async () => {
  const rate = parseFloat(document.getElementById('ig-rate').value) || 2;
  const file = document.getElementById('ig-file').files[0];
  let body;
  if (file) body = {filename: file.name, content: await file.text(), rate};
  else body = {text: document.getElementById('ig-paste').value, rate};
  const out = await (await fetch('/instagram/replay', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})).json();
  igStatus(out.ok ? `replaying ${out.total} comments at ${rate}/s` : `error: ${out.error}`);
};

document.getElementById('ig-stop').onclick = async () => {
  await fetch('/instagram/stop', {method:'POST'});
  igStatus('stopped');
};

document.getElementById('ig-fetch').onclick = async () => {
  igStatus('fetching…');
  const rate = parseFloat(document.getElementById('ig-rate').value) || 2;
  const out = await (await fetch('/instagram/fetch', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({rate})})).json();
  igStatus(out.ok ? `replaying ${out.total} fetched comments at ${rate}/s` : `error: ${out.error}`);
};

// ---------- SSE ----------
const events = new EventSource('/events');
events.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'message') addRow(msg.row);
  else if (msg.type === 'stats') renderStats(msg.stats);
  else if (msg.type === 'twitch') renderTwitch(msg.status, msg.channel);
  else if (msg.type === 'banner') showBanner(msg.text);
  else if (msg.type === 'instagram') igStatus(`${msg.status} (${msg.sent}/${msg.total})`);
  else if (msg.type === 'error') console.warn('classify error:', msg.detail);
  else if (msg.type === 'brief') window.onBriefEvent && window.onBriefEvent(msg);
};

// ---------- initial snapshot ----------
fetch('/snapshot').then(r => r.json()).then(snap => {
  renderStats(snap.stats);
  renderTwitch(snap.twitch.status, snap.twitch.channel);
  if (snap.api_key_missing) showBanner('TYPESAFE_API_KEY missing in .env — messages flow but nothing is classified. Add the key and restart.');
  presets = snap.presets;
  const presetSel = document.getElementById('brief-preset');
  const splitSel = document.getElementById('split-preset');
  presetSel.innerHTML = splitSel.innerHTML = Object.entries(presets).map(([k, b]) =>
    `<option value="${esc(k)}">${esc(b.name)}</option>`).join('');
  loadBriefForm(snap.brief);
  document.getElementById('brief-version').textContent = 'v' + snap.brief_version;
  if (snap.split_key) {
    document.getElementById('split-toggle').checked = true;
    splitSel.value = snap.split_key;
  }
  if (snap.ig_graph_enabled) document.getElementById('ig-fetch').classList.remove('hidden');
  window.onSnapshot && window.onSnapshot(snap);   // brief editor hook (step 3)
});
</script>
</body>
</html>
