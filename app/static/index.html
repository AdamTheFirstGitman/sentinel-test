<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentinel-test</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0b0f14; color:#d7dde4; }
  .panel { background:#121820; border:1px solid #1f2a36; border-radius:0.5rem; }
  input, textarea, select { background:#0b0f14; border:1px solid #2a3847; border-radius:0.375rem;
    padding:0.3rem 0.5rem; font-size:0.8rem; color:#d7dde4; width:100%; }
  button { border-radius:0.375rem; padding:0.3rem 0.7rem; font-size:0.8rem; font-weight:600; }
  .btn-primary { background:#2563eb; color:white; } .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#1f2a36; color:#9fb0c0; } .btn-ghost:hover { background:#2a3847; }
  .chip { font-size:0.7rem; padding:0.15rem 0.6rem; border-radius:999px; background:#1f2a36;
    color:#9fb0c0; cursor:pointer; }
  .chip.active { background:#2563eb; color:white; }
  .tab { font-size:0.8rem; font-weight:700; padding:0.3rem 1rem; border-radius:0.375rem;
    color:#9fb0c0; cursor:pointer; }
  .tab.active-twitch { background:#9146ff; color:white; }
  .tab.active-instagram { background:#e1306c; color:white; }
</style>
</head>
<body class="h-screen overflow-hidden text-sm flex flex-col">

<div id="banner" class="hidden px-4 py-2 bg-red-900/80 text-red-100 text-xs font-semibold"></div>

<header class="flex items-center gap-3 px-4 py-2 border-b border-[#1f2a36]">
  <span class="font-bold text-slate-300">sentinel-test</span>
  <span class="tab" data-tab="twitch">Twitch</span>
  <span class="tab" data-tab="instagram">Instagram</span>
  <span class="flex-1"></span>
  <span id="global-cost" class="text-xs font-mono text-slate-400"></span>
</header>

<!-- The two views are identical shells; everything inside is scoped by data-source. -->
<main id="views" class="flex-1 min-h-0"></main>

<template id="view-template">
  <section class="grid grid-cols-[300px_1fr_300px] gap-3 p-3 h-full min-h-0">

    <!-- LEFT: source controls + brief -->
    <div class="flex flex-col gap-3 overflow-y-auto pr-1">
      <div class="panel p-3" data-slot="source"></div>

      <div class="panel p-3" data-el="brief-panel">
        <div class="flex items-center justify-between mb-2">
          <h2 data-el="brief-title" class="font-bold text-xs uppercase tracking-wide">Brief</h2>
          <span data-el="brief-version" class="text-[10px] text-slate-500 font-mono">v1</span>
        </div>
        <textarea data-el="brief-context" rows="4" class="mb-2" placeholder="creator context"></textarea>
        <div class="text-[10px] text-slate-500 mb-1">
          Topics are your declared sensitive subjects. Jev matches the <b>description</b>;
          the <b>key</b> names the class (<span class="font-mono">hostile_&lt;key&gt;</span>);
          <b>tolerate</b> topics add no class.
        </div>
        <div data-el="topics" class="flex flex-col gap-2 mb-2"></div>
        <div class="flex gap-2">
          <button data-el="add-topic" class="btn-ghost flex-1">+ topic</button>
          <button data-el="apply-brief" class="btn-primary flex-1">Apply brief</button>
        </div>
      </div>
    </div>

    <!-- CENTRE: feed -->
    <div class="flex flex-col panel overflow-hidden min-h-0">
      <div class="flex items-center gap-2 px-3 py-2 border-b border-[#1f2a36]">
        <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mr-2">Feed</h2>
        <span class="chip active" data-filter="all">all</span>
        <span class="chip" data-filter="hostile">hostile only</span>
        <span class="chip" data-filter="grey">grey zone &lt;0.6</span>
        <span class="flex-1"></span>
        <select data-el="mode" class="w-auto text-xs py-0.5"
                title="choice: one exclusive class per message, probabilities sum to 1.&#10;multi-label: an independent 0-1 score per label (several can fire at once); class shown = top label ≥ 0.5, else ok.">
          <option value="choice">choice — one class</option>
          <option value="nouls">multi-label — score per label</option>
        </select>
      </div>
      <div data-el="feed" class="flex-1 overflow-y-auto divide-y divide-[#17202b]"></div>
    </div>

    <!-- RIGHT: stats + tools -->
    <div class="flex flex-col gap-3 overflow-y-auto pr-1">
      <div class="panel p-3">
        <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Stats</h2>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs" data-el="stats-grid"></div>
        <div class="mt-3">
          <div class="text-xs text-slate-500 mb-1">class distribution</div>
          <div data-el="class-dist" class="flex h-3 rounded overflow-hidden bg-[#1f2a36]"></div>
          <div data-el="class-legend" class="mt-1 flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] text-slate-400"></div>
        </div>
      </div>
      <div class="panel p-3">
        <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Perturbations</h2>
        <input data-el="perturb-text" placeholder="message to test (empty = last message of this source)" class="mb-2">
        <button data-el="perturb-btn" class="btn-primary w-full">Replay with perturbations</button>
        <div data-el="perturb-results" class="mt-2 flex flex-col gap-1 text-xs"></div>
      </div>
    </div>
  </section>
</template>

<template id="twitch-source-template">
  <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Twitch chat (live, read-only)</h2>
  <div class="flex gap-2">
    <input data-el="twitch-channel" placeholder="channel name">
    <button data-el="twitch-btn" class="btn-primary shrink-0">Join</button>
  </div>
  <div data-el="twitch-status" class="text-xs text-slate-500 mt-2">disconnected</div>
</template>

<template id="instagram-source-template">
  <h2 class="font-bold text-xs uppercase tracking-wide text-slate-400 mb-2">Instagram post (read-only)</h2>
  <div class="flex gap-2 mb-2">
    <input data-el="ig-url" placeholder="https://www.instagram.com/p/…">
    <button data-el="ig-load" class="btn-primary shrink-0">Load</button>
  </div>
  <details class="mb-2">
    <summary class="text-[10px] text-slate-500 cursor-pointer">or paste / upload comments</summary>
    <textarea data-el="ig-paste" rows="4" class="my-2"
      placeholder="one comment per line&#10;author: text  (or just text)"></textarea>
    <input type="file" data-el="ig-file" accept=".json,.csv,.txt" class="text-[10px] p-0 border-0 mb-2">
    <button data-el="ig-replay" class="btn-ghost w-full">Replay pasted / uploaded</button>
  </details>
  <div class="flex gap-2 items-center">
    <label class="text-[10px] text-slate-500 shrink-0">rate/s</label>
    <input type="number" data-el="ig-rate" value="2" min="0.1" max="20" step="0.5" style="width:4.5rem">
    <span class="flex-1"></span>
    <button data-el="ig-stop" class="btn-ghost">Stop</button>
  </div>
  <div data-el="ig-status" class="text-[10px] text-slate-500 mt-2"></div>
</template>

<script>
// ---------- class colours ----------
const FIXED_COLORS = { ok:'#10b981', noise:'#64748b', critique:'#f59e0b', hostile_other:'#ef4444' };
const HOSTILE_PALETTE = ['#e11d48', '#c026d3', '#9333ea', '#ea580c', '#db2777'];
const colorCache = {};
function classColor(klass) {
  if (FIXED_COLORS[klass]) return FIXED_COLORS[klass];
  if (!(klass in colorCache)) {
    colorCache[klass] = HOSTILE_PALETTE[Object.keys(colorCache).length % HOSTILE_PALETTE.length];
  }
  return colorCache[klass];
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normKey = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
const MAX_ROWS = 200;
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify(body)}).then(r => r.json());

function showBanner(text) {
  const b = document.getElementById('banner');
  b.textContent = text;
  b.classList.remove('hidden');
}

// ---------- shared row rendering ----------
function probBar(probs) {
  const segs = Object.entries(probs).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div title="${esc(k)}: ${(v*100).toFixed(0)}%" style="width:${v*100}%;background:${classColor(k)}"></div>`);
  return `<div class="flex h-1.5 rounded overflow-hidden bg-[#1f2a36] mt-1">${segs.join('')}</div>`;
}

// nouls mode: independent scores — one bar per label instead of a shared stacked bar.
function noulBars(scores) {
  return Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k, v]) => `
    <div class="flex items-center gap-1 mt-0.5">
      <span class="text-[9px] w-24 truncate text-right" style="color:${classColor(k)}">${esc(k)}</span>
      <div class="flex-1 h-1.5 rounded bg-[#1f2a36]">
        <div class="h-1.5 rounded" style="width:${v*100}%;background:${classColor(k)}"></div>
      </div>
      <span class="text-[9px] text-slate-400 w-7 text-right">${(v*100).toFixed(0)}%</span>
    </div>`).join('');
}

const scoreBlock = v => v.mode === 'nouls' ? noulBars(v.probabilities) : probBar(v.probabilities);
const confBadge = v => v.confidence == null ? ''
  : `<span class="text-[10px] text-slate-400" title="${CONF_HELP}">conf ${v.confidence.toFixed(2)}</span>`;

const CONF_HELP = 'confidence = how concentrated the probabilities are, not the top '
  + 'class’s probability: one clear peak → high, several close options → low';

function verdictBlock(v) {
  return `<div class="flex items-center gap-2">
    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold text-white"
          style="background:${classColor(v.klass)}">${esc(v.klass)}</span>
    ${confBadge(v)}
    <span class="text-[10px] text-slate-500">${v.latency_ms}ms · $${v.cost_usd.toFixed(6)} · v${v.brief_version}</span>
  </div>${scoreBlock(v)}`;
}

// ---------- one view per source ----------
const ACCENTS = { twitch: '#9146ff', instagram: '#e1306c' };  // brand-ish colours

class View {
  constructor(source) {
    this.source = source;
    this.filter = 'all';
    this.accent = ACCENTS[source];
    this.root = document.getElementById('view-template').content.firstElementChild.cloneNode(true);
    this.root.id = `view-${source}`;
    this.root.querySelector('[data-slot="source"]').append(
      document.getElementById(`${source}-source-template`).content.cloneNode(true));
    document.getElementById('views').append(this.root);
    this.el = {};
    this.root.querySelectorAll('[data-el]').forEach(n => this.el[n.dataset.el] = n);
    // Make each source's brief unmistakable: accent border, named title, accent button.
    this.el['brief-panel'].style.borderLeft = `3px solid ${this.accent}`;
    this.el['brief-title'].textContent = `Brief — ${source}`;
    this.el['brief-title'].style.color = this.accent;
    this.el['apply-brief'].style.background = this.accent;
    this.wireBrief();
    this.wirePerturb();
    this.wireFilters();
    this.el.mode.onchange = () => post('/mode', {source: this.source, mode: this.el.mode.value});
  }

  // -- feed --
  rowMatches(row) {
    const v = row.verdict;
    if (this.filter === 'hostile') return v.klass.startsWith('hostile');
    if (this.filter === 'grey') {
      if (v.mode === 'nouls') {  // ambiguous = top label neither clearly off nor clearly on
        const top = Math.max(...Object.values(v.probabilities));
        return top >= 0.3 && top < 0.6;
      }
      return v.confidence < 0.6;
    }
    return true;
  }

  addRow(row) {
    const el = document.createElement('div');
    el.className = 'px-3 py-2 feed-row';
    el.dataset.row = JSON.stringify(row);
    const time = new Date(row.ts * 1000).toLocaleTimeString();
    const badges = (row.author.badges || []).map(b => b.split('/')[0]).slice(0,3).join(',');
    el.innerHTML = `
      <div class="flex items-baseline gap-2">
        <span class="text-[10px] text-slate-500 shrink-0">${time}</span>
        <span class="font-semibold text-xs text-slate-300 shrink-0">${esc(row.author.name)}</span>
        ${badges ? `<span class="text-[9px] text-slate-500">[${esc(badges)}]</span>` : ''}
        ${row.author.is_new_to_stream ? '<span class="text-[9px] text-sky-400">new</span>' : ''}
      </div>
      <div class="text-xs text-slate-200 my-1 break-words">${esc(row.text)}</div>
      ${verdictBlock(row.verdict)}
      <div class="row-actions mt-1 flex items-center gap-1"></div>`;
    el.style.display = this.rowMatches(row) ? '' : 'none';
    this.decorateRow(el, row);
    this.el.feed.prepend(el);
    while (this.el.feed.children.length > MAX_ROWS) this.el.feed.lastChild.remove();
  }

  decorateRow(el, row) {
    const classes = Object.keys(row.verdict.probabilities);
    if (!classes.includes('ok')) classes.unshift('ok');  // nouls mode has no "ok" question
    const slot = el.querySelector('.row-actions');
    slot.innerHTML = `
      <span class="text-[10px] text-slate-500">I'd have said:</span>
      <select class="label-class w-auto text-[10px] py-0 px-1">
        ${classes.map(c => `<option ${c===row.verdict.klass?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <button class="label-send btn-ghost text-[10px] py-0 px-1.5">label</button>`;
    slot.querySelector('.label-send').onclick = async () => {
      const my = slot.querySelector('.label-class').value;
      await post('/label', {source: this.source, text: row.text,
        previous_messages: row.previous_messages, brief_version: row.verdict.brief_version,
        jev_class: row.verdict.klass, my_class: my});
      slot.innerHTML = `<span class="text-[10px] text-emerald-400">labelled: ${esc(my)}</span>`;
    };
  }

  wireFilters() {
    this.root.querySelectorAll('.chip[data-filter]').forEach(chip => chip.onclick = () => {
      this.root.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      this.filter = chip.dataset.filter;
      this.el.feed.querySelectorAll('.feed-row').forEach(el => {
        el.style.display = this.rowMatches(JSON.parse(el.dataset.row)) ? '' : 'none';
      });
    });
  }

  // -- brief editor --
  topicRow(t = {key:'', label:'', description:'', policy:'remove'}) {
    const POLICIES = {
      remove:   'remove — hostile class, cut it',
      hold:     'hold — hostile class, review it',
      tolerate: 'tolerate — allowed, no hostile class',
    };
    const row = document.createElement('div');
    row.className = 'topic-row border border-[#1f2a36] rounded p-2 flex flex-col gap-1';
    row.innerHTML = `
      <div class="flex gap-1">
        <input class="t-key" placeholder="key (short id)" value="${esc(t.key)}" style="width:35%"
               title="short id — becomes the class hostile_<key>">
        <input class="t-label" placeholder="label (for you only)" value="${esc(t.label)}"
               title="display name, not used for classification">
        <button class="t-del btn-ghost shrink-0 px-2">×</button>
      </div>
      <div class="t-hint text-[10px] font-mono text-slate-500"></div>
      <textarea class="t-desc" rows="2"
        placeholder="description — what counts as a hit; this is the text Jev matches against"
        title="the criterion Jev reads for this class">${esc(t.description)}</textarea>
      <select class="t-policy" title="tolerate topics add no hostile class">
        ${Object.entries(POLICIES).map(([p, txt]) =>
          `<option value="${p}" ${p===t.policy?'selected':''}>${txt}</option>`).join('')}
      </select>`;
    row.querySelector('.t-del').onclick = () => row.remove();
    const keyInput = row.querySelector('.t-key');
    const policySel = row.querySelector('.t-policy');
    const hint = row.querySelector('.t-hint');
    const updateHint = () => {
      const k = normKey(keyInput.value);
      hint.textContent = !k ? ''
        : policySel.value === 'tolerate' ? `${k} → tolerated, adds no class`
        : `→ adds class hostile_${k}`;
      hint.style.color = policySel.value === 'tolerate' ? '' : classColor('hostile_' + k);
    };
    keyInput.oninput = policySel.onchange = updateHint;
    updateHint();
    return row;
  }

  loadBrief(brief, version) {
    this.el['brief-context'].value = brief.creator_context;
    this.el.topics.innerHTML = '';
    brief.topics.forEach(t => this.el.topics.appendChild(this.topicRow(t)));
    this.el['brief-version'].textContent = 'v' + version;
  }

  wireBrief() {
    this.el['add-topic'].onclick = () => this.el.topics.appendChild(this.topicRow());
    this.el['apply-brief'].onclick = async () => {
      const topics = [...this.el.topics.querySelectorAll('.topic-row')].map(row => ({
        key: normKey(row.querySelector('.t-key').value),
        label: row.querySelector('.t-label').value.trim(),
        description: row.querySelector('.t-desc').value.trim(),
        policy: row.querySelector('.t-policy').value,
      })).filter(t => t.key && t.description);
      const out = await post('/brief/apply', {source: this.source, name: this.source,
        creator_context: this.el['brief-context'].value, topics});
      if (!out.ok) alert('apply failed: ' + JSON.stringify(out));
    };
  }

  // -- perturbation tool --
  perturbCard(name, text, v, baseline = false) {
    const probs = Object.entries(v.probabilities).sort((a,b)=>b[1]-a[1]);
    const probList = v.mode === 'nouls' ? '' :
      `<div class="flex flex-wrap gap-x-2 text-[10px] text-slate-400 mt-1">` +
      probs.filter(([,p]) => p >= 0.005).slice(0, 4).map(([k, p]) =>
        `<span class="whitespace-nowrap"><span style="color:${classColor(k)}">●</span> ${esc(k)} <b>${(p*100).toFixed(0)}%</b></span>`
      ).join(' ') + `</div>`;
    return `
      <div class="border ${baseline ? 'border-slate-500' : 'border-[#1f2a36]'} rounded p-1.5">
        <div class="flex items-center gap-2">
          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold text-white"
                style="background:${classColor(v.klass)}">${esc(v.klass)}</span>
          ${confBadge(v)}
          <span class="text-[10px] ${baseline ? 'text-slate-300 font-bold' : 'text-slate-500'} ml-auto">${esc(name)}</span>
        </div>
        <div class="text-[10px] text-slate-400 break-words mt-0.5">${esc(text)}</div>
        ${scoreBlock(v)}
        ${probList}
      </div>`;
  }

  wirePerturb() {
    this.el['perturb-btn'].onclick = async () => {
      const box = this.el['perturb-results'];
      box.innerHTML = '<span class="text-slate-500">classifying baseline + 4 variants…</span>';
      const out = await post('/perturb', {source: this.source, text: this.el['perturb-text'].value});
      if (!out.ok) { box.innerHTML = `<span class="text-red-400">${esc(out.error)}</span>`; return; }
      box.innerHTML =
        this.perturbCard('original (baseline)', out.original, out.baseline, true) +
        out.results.map(r => this.perturbCard(r.name, r.text, r.verdict)).join('') +
        `<div class="text-[10px] text-slate-600">classified with empty chat context for
         comparability — the model itself is slightly stochastic (± a few points per run),
         and the emoji tail is re-sampled on purpose each run</div>`;
    };
  }

  // -- stats --
  renderStats(s) {
    const pairs = [
      ['msgs/min', s.msgs_per_min], ['classified', s.classified],
      ['dropped', s.dropped], ['queue', s.queue_size],
      ['p50 latency', s.latency_p50 + 'ms'], ['p95 latency', s.latency_p95 + 'ms'],
      ['brief', 'v' + s.brief_version],
    ];
    this.el['stats-grid'].innerHTML = pairs.map(([k, v]) =>
      `<div class="text-slate-500">${k}</div><div class="text-right font-mono">${v}</div>`).join('');
    const total = Object.values(s.class_counts).reduce((a,b)=>a+b, 0) || 1;
    const sorted = Object.entries(s.class_counts).sort((a,b)=>b[1]-a[1]);
    this.el['class-dist'].innerHTML = sorted.map(([k, n]) =>
      `<div title="${esc(k)}: ${n}" style="width:${n/total*100}%;background:${classColor(k)}"></div>`).join('');
    this.el['class-legend'].innerHTML = sorted.map(([k, n]) =>
      `<span><span style="color:${classColor(k)}">●</span> ${esc(k)} ${n}</span>`).join('');
  }
}

const views = { twitch: new View('twitch'), instagram: new View('instagram') };

// ---------- tabs ----------
let activeTab = 'twitch';
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active-twitch', 'active-instagram');
    if (t.dataset.tab === tab) t.classList.add(`active-${tab}`);
  });
  Object.entries(views).forEach(([s, v]) => v.root.style.display = s === tab ? '' : 'none');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
setTab('twitch');

// ---------- twitch source controls ----------
const tEl = views.twitch.el;
let twitchConnected = false;
tEl['twitch-btn'].onclick = async () => {
  if (twitchConnected) await post('/twitch/part', {});
  else {
    const channel = tEl['twitch-channel'].value.trim();
    if (channel) await post('/twitch/join', {channel});
  }
};
function renderTwitch(status, channel) {
  twitchConnected = ['connected', 'connecting', 'reconnecting'].includes(status);
  tEl['twitch-btn'].textContent = twitchConnected ? 'Leave' : 'Join';
  tEl['twitch-btn'].className = (twitchConnected ? 'btn-ghost' : 'btn-primary') + ' shrink-0';
  tEl['twitch-status'].textContent = channel ? `${status} — #${channel}` : status;
}

// ---------- instagram source controls ----------
const iEl = views.instagram.el;
const igStatus = text => iEl['ig-status'].textContent = text;
const igRate = () => parseFloat(iEl['ig-rate'].value) || 2;

iEl['ig-load'].onclick = async () => {
  const url = iEl['ig-url'].value.trim();
  if (!url) return;
  igStatus('fetching comments…');
  const out = await post('/instagram/fetch_url', {url, rate: igRate()});
  igStatus(out.ok ? `replaying ${out.total} comments at ${igRate()}/s` : `error: ${out.error}`);
};
iEl['ig-replay'].onclick = async () => {
  const file = iEl['ig-file'].files[0];
  const body = file ? {filename: file.name, content: await file.text(), rate: igRate()}
                    : {text: iEl['ig-paste'].value, rate: igRate()};
  const out = await post('/instagram/replay', body);
  igStatus(out.ok ? `replaying ${out.total} comments at ${igRate()}/s` : `error: ${out.error}`);
};
iEl['ig-stop'].onclick = async () => { await post('/instagram/stop', {}); igStatus('stopped'); };

// ---------- SSE ----------
function renderGlobal(stats) {
  document.getElementById('global-cost').textContent =
    `$${stats.cost_usd.toFixed(4)} / $${stats.max_cost_usd.toFixed(2)}`;
  if (stats.paused) showBanner(
    `Budget exceeded ($${stats.cost_usd.toFixed(2)} / $${stats.max_cost_usd.toFixed(2)}) — classification paused.`);
  Object.entries(views).forEach(([s, v]) => v.renderStats(stats.sentinels[s]));
}

const events = new EventSource('/events');
events.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'message') views[msg.source]?.addRow(msg.row);
  else if (msg.type === 'stats') renderGlobal(msg.stats);
  else if (msg.type === 'twitch') renderTwitch(msg.status, msg.channel);
  else if (msg.type === 'instagram') igStatus(`${msg.status} (${msg.sent}/${msg.total})`);
  else if (msg.type === 'banner') showBanner(msg.text);
  else if (msg.type === 'brief') views[msg.source]?.loadBrief(msg.brief, msg.version);
  else if (msg.type === 'mode') views[msg.source].el.mode.value = msg.mode;
  else if (msg.type === 'error') console.warn(`classify error [${msg.source}]:`, msg.detail);
};

// ---------- initial snapshot ----------
fetch('/snapshot').then(r => r.json()).then(snap => {
  renderGlobal(snap.stats);
  renderTwitch(snap.twitch.status, snap.twitch.channel);
  Object.entries(snap.briefs).forEach(([s, b]) => {
    views[s].loadBrief(b.brief, b.version);
    views[s].el.mode.value = b.mode;
  });
  if (snap.api_key_missing)
    showBanner('TYPESAFE_API_KEY missing in .env — messages flow but nothing is classified. Add the key and restart.');
  if (!snap.ig_graph_enabled)
    igStatus('no IG_ACCESS_TOKEN in .env — URL mode disabled, paste/upload still works');
});
</script>
